name: Deploy Gaoqiz Pages

"on":
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: hignnlow/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install app dependencies
        working-directory: hignnlow
        run: npm ci

      - name: Check TypeScript
        working-directory: hignnlow
        run: npm run typecheck

      - name: Run ESLint
        working-directory: hignnlow
        run: npm run lint

      - name: Run tests
        working-directory: hignnlow
        run: npm run test

      - name: Build static app
        working-directory: hignnlow
        run: npm run build:pages

      - name: Prepare complete website
        run: |
          mkdir -p _site

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="highnlow/" \
            --exclude="hignnlow/" \
            --exclude="node_modules/" \
            ./ _site/

          mkdir -p _site/highnlow
          cp -R hignnlow/out/. _site/highnlow/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
