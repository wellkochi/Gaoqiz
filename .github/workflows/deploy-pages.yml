name: Deploy Gaoqiz Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highlowstats/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install app dependencies
        working-directory: highlowstats
        run: npm ci

      - name: Check TypeScript
        working-directory: highlowstats
        run: npm run typecheck

      - name: Run lint
        working-directory: highlowstats
        run: npm run lint

      - name: Run tests
        working-directory: highlowstats
        run: npm run test

      - name: Build static app
        working-directory: highlowstats
        run: npm run build:pages

      - name: Prepare complete website
        run: |
          mkdir -p _site

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="_site" \
            --exclude="highlowstats" \
            --exclude="hi*low" \
            ./ _site/

          mkdir -p _site/highlowstats
          cp -R highlowstats/out/. _site/highlowstats/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
